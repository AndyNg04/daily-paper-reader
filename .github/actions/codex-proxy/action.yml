name: Start Codex proxy
description: >-
  在本机 127.0.0.1 启动 CLIProxyAPI，用 ChatGPT 订阅（Codex）额度提供 OpenAI 兼容接口，
  并把项目的 LLM 环境变量（DEEPSEEK_* / SUMMARY_*）指向它。fork 专用。
  用完必须在同一个 job 里跑 codex-auth-writeback（if: always()），否则刷新过的凭证会丢。
inputs:
  auth-json:
    description: secrets.CODEX_AUTH_JSON
    required: true
  model:
    description: 总结（Step 6，精读/速读）用的模型；留空则自动用 proxy 支持的最新 sol 系列模型
    required: false
    default: ""
  fast-model:
    description: 筛选、查询改写等其他环节用的模型；留空则自动用最新 luna 系列模型
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Start Codex proxy
      shell: bash
      env:
        CODEX_AUTH_JSON: ${{ inputs.auth-json }}
        CODEX_MODEL: ${{ inputs.model }}
        CODEX_FAST_MODEL: ${{ inputs.fast-model }}
      run: bash "$GITHUB_WORKSPACE/scripts/codex_proxy.sh" start
