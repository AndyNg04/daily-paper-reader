name: remote-dispatch

# fork 专用：把推送到 dispatch/** 分支的请求转成一次 workflow_dispatch。
# 用途：自动化助手没有触发 workflow 的权限，但能推送分支。它在 main 之上提交一个只含
# .github/dispatch-request.json 的提交，推到 dispatch/<名字>；本 workflow 校验请求
# （白名单见 scripts/dispatch_request.py），用 GITHUB_TOKEN 在 main 上触发目标 workflow，
# 最后删掉这个临时分支。GitHub 允许 GITHUB_TOKEN 触发的 workflow_dispatch 创建新运行。
# 只有对本仓库有写权限的人才能推送分支，fork 的 PR 不会触发这里的 push 事件。
on:
  push:
    branches:
      - "dispatch/**"

permissions:
  actions: write
  contents: write

concurrency:
  group: remote-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository != 'ziwenhahaha/daily-paper-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 只取脚本和 .github，避免检出很大的 docs/。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github

      - name: Dispatch requested workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/dispatch_request.py --request .github/dispatch-request.json --repo "$GITHUB_REPOSITORY"

      - name: Delete dispatch branch
        if: always()
        run: |
          set -euo pipefail
          git push origin --delete "refs/heads/${GITHUB_REF_NAME}"
