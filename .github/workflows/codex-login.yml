name: codex-login

# 用设备码登录 ChatGPT（Codex），把凭证存进 repo secret CODEX_AUTH_JSON（fork 专用）。
# 用法：Actions 里手动运行 → 打开日志里的 "Codex device URL"，登录 ChatGPT，输入
# "Codex device code"（15 分钟内有效）→ 运行成功后凭证就存好了。
# 只在第一次或凭证失效（改了密码、登出所有设备等）时需要运行。
#
# 需要的 secret：CODEX_SECRET_WRITE_TOKEN — fine-grained PAT，只授权本仓库，
# 权限只给 Repository permissions → Secrets: Read and write。
# 仓库公开，日志公开：日志里只有网址和验证码，别人拿到验证码也只能登录他自己的账号；
# 凭证本身不会出现在日志里。
on:
  workflow_dispatch:

permissions:
  contents: read

# 与 codex-refresh 共用一组，避免两边同时写 CODEX_AUTH_JSON。
concurrency:
  group: codex-auth
  cancel-in-progress: false

jobs:
  login:
    if: github.repository != 'ziwenhahaha/daily-paper-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github/actions

      - name: Check write token
        env:
          GH_TOKEN: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::缺少 secret CODEX_SECRET_WRITE_TOKEN（只给本仓库 Secrets 读写权限的 fine-grained PAT），登录后无法保存凭证。"
            exit 1
          fi

      - name: Device login
        run: bash scripts/codex_proxy.sh login

      - name: Save credentials to CODEX_AUTH_JSON
        if: always()
        uses: ./.github/actions/codex-auth-writeback
        with:
          write-token: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
          always: "true"
