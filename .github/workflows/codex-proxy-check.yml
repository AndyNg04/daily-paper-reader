name: codex-proxy-check

# 手动运行：启动 Codex proxy，用项目自己的 LLMClient 按真实调用方式逐项测兼容性
# （普通对话、JSON mode、json_schema、assistant 续写、max_tokens、thinking 参数、长输入），
# 并列出账号可用的模型。结果在运行页面的 Summary 里。fork 专用。
on:
  workflow_dispatch:
    inputs:
      model:
        description: "总结用的模型（留空用仓库变量 CODEX_MODEL 或默认值）"
        required: false
        type: string
      fast_model:
        description: "其他环节用的模型（留空用仓库变量 CODEX_FAST_MODEL 或默认值）"
        required: false
        type: string
      extra_models:
        description: "额外对比的模型，逗号分隔（例如 gpt-6-sol,gpt-6-luna）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-auth
  cancel-in-progress: false

jobs:
  check:
    if: github.repository != 'ziwenhahaha/daily-paper-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            src
            .github/actions

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Start Codex proxy
        uses: ./.github/actions/codex-proxy
        with:
          auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          model: ${{ inputs.model || vars.CODEX_MODEL }}
          fast-model: ${{ inputs.fast_model || vars.CODEX_FAST_MODEL }}

      - name: Check compatibility
        env:
          CODEX_CHECK_EXTRA_MODELS: ${{ inputs.extra_models }}
        run: python scripts/codex_proxy_check.py

      - name: Write back CODEX_AUTH_JSON
        if: always()
        uses: ./.github/actions/codex-auth-writeback
        with:
          write-token: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
