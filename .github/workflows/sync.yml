name: Upstream Sync

permissions:
  contents: write # 必须有写权限才能合并代码

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0点（北京时间早8点）检查更新
  workflow_dispatch: # 允许用户手动点击触发

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Random delay to spread scheduled runs
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(shuf -i 0-3599 -n 1)
          echo "Sleeping ${DELAY}s (≈$((DELAY/60))min) to stagger scheduled runs over 1 hour …"
          sleep $DELAY

      # 1. 检出用户仓库的代码
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. 配置 .gitattributes 中的 merge=ours 驱动，用于保护用户运行态文件
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global merge.ours.driver true

      # 3. 不依赖 GitHub fork 关系，直接从显式上游仓库拉取并合并
      - name: Merge upstream changes
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME:-main}"
          upstream_repo="https://github.com/ziwenhahaha/daily-paper-reader.git"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$upstream_repo"

          git fetch origin "$branch"
          git fetch upstream main

          git checkout "$branch"
          git merge --no-edit upstream/main
          git push origin "HEAD:$branch"

      # 4. 如果同步失败（比如有冲突），打印错误
      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 自动同步失败！可能是因为你修改了源代码导致冲突。"
          echo "请手动前往 GitHub 页面解决冲突。"
          exit 1
