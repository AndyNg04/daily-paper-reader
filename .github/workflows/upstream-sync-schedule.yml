name: Upstream Sync (scheduled)

# Fork 专用：每天定时调用 sync.yml 把上游合并进本仓库。
# 同步逻辑本身在 sync.yml 里，那边保持 workflow_dispatch 可手动触发。

permissions:
  contents: write

on:
  schedule:
    - cron: "23 0 * * *" # 每天 UTC 00:23（北京时间 08:23）

jobs:
  sync:
    if: github.repository != 'ziwenhahaha/daily-paper-reader'
    # 并发控制放在 sync.yml 的 job 上；调用方不能再用同名 concurrency group，
    # 否则 GitHub 会判定为死锁并取消运行。
    uses: ./.github/workflows/sync.yml
    secrets: inherit
